version: 2

sources:
  - name: jaffle_shop
    description: This a clon of external database
    database: RAW
    schema: jaffle_shop
    freshness: 
          error_after: {count: 2, period: day}
          warn_after: {count: 12, period: day}
    loaded_at_field: _etl_loaded_at
    tables:
      - name: customers
        description: This a raw customer data
        columns:
          - name: id
            description: This is a primary key of customers
            tests:
              - unique
              - not_null
        freshness: null
      - name: orders
        description: This is a raw orders data
        columns:
          - name: id
            description: This is a primary key of orders
            tests:
              - unique
              - not_null
        
        